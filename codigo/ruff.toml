extend = "../pyproject.toml"
# El código del libro debe caber en la página impresa (ver scripts/extraer_fragmentos.py).
line-length = 58

[lint]
# Código de notebook: expresiones sueltas que se muestran e imports por celda.
# F821: cada capítulo usa las variables definidas en los capítulos anteriores.
ignore = ["B018", "I001", "E402", "F821"]

[lint.per-file-ignores]
"tests/*" = ["E501"]
